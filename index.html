<style>
/* Layout: the sibling of the Polish app. One-column phone app on squared notebook paper.
   The "Tegels" look: ink blue for actions, ochre like old cement tiles, terracotta as the teacher's pen. */
:root{
  --paper:#F4EFE5; --slate:#E9E4D9; --grid:rgba(35,58,94,.065); --card:#FFFFFF; --ink:#1C2230; --muted:#5D6370; --line:#DDD5C6;
  --blue:#233A5E; --blue-soft:#E1E7F0; --on-blue:#F4EFE5; --ochre:#D9A441; --ochre-soft:#F6EBD3;
  --pen:#B0502D; --pen-soft:#F6E3DA; --ok:#1F7A4D; --ok-soft:#E1F1E7;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Source Sans 3',system-ui,-apple-system,sans-serif;
  --f-hand:'Caveat','Bradley Hand','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121826; --slate:#1E2638; --grid:rgba(217,164,65,.05); --card:#1A2232; --ink:#ECEFF4; --muted:#9AA3B4; --line:#2C3548;
  --blue:#A9C0E8; --blue-soft:#23304A; --on-blue:#121826; --ochre:#E3B45A; --ochre-soft:#3A3120;
  --pen:#F08A64; --pen-soft:#3A2420; --ok:#4FCB8E; --ok-soft:#14322A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121826; --slate:#1E2638; --grid:rgba(217,164,65,.05); --card:#1A2232; --ink:#ECEFF4; --muted:#9AA3B4; --line:#2C3548;
  --blue:#A9C0E8; --blue-soft:#23304A; --on-blue:#121826; --ochre:#E3B45A; --ochre-soft:#3A3120;
  --pen:#F08A64; --pen-soft:#3A2420; --ok:#4FCB8E; --ok-soft:#14322A; color-scheme:dark}

body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.app.quiz{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.05}
p{margin:0}
.eyebrow{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lede{color:var(--muted);font-size:15.5px;max-width:60ch}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding-top:6px}
.hero>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.when{color:var(--muted);font-size:15px}
.when b{color:var(--pen);font-weight:700}
.grade-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.grade{font-family:var(--f-hand);font-weight:700;font-size:62px;line-height:1;color:var(--pen);width:88px;height:88px;display:grid;place-items:center;border:3px solid var(--pen);border-radius:52% 46% 55% 44% / 48% 55% 45% 52%;transform:rotate(-7deg)}
.grade-lbl{font-family:var(--f-hand);font-size:21px;color:var(--pen);line-height:1}
.cta{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;border-radius:16px;padding:18px 20px;background:var(--blue);color:var(--on-blue);text-align:left}
.cta span{font-family:var(--f-display);font-weight:800;font-size:24px}
.cta small{font-size:15px;opacity:.85}
.cta2{width:100%;border:2px solid var(--pen);background:var(--pen-soft);color:var(--pen);border-radius:14px;padding:13px 18px;font-weight:700;text-align:left}
.sec{font-size:19px;font-weight:600;margin-top:6px}
.decks{display:flex;flex-direction:column;gap:10px}
.deck{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.dn{font-weight:700;font-size:17.5px;min-width:0}
.dp{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue);font-size:15px}
.de{grid-column:1/-1;color:var(--muted);font-size:14.5px}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--blue-soft);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:3px}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:6px}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14.5px;color:var(--muted)}
.ghost.armed{border-color:var(--pen);color:var(--pen)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--muted)}
.toggle input{width:20px;height:20px;accent-color:var(--blue)}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.qx{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.bar{flex:1;height:8px;background:var(--blue-soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.count{font-variant-numeric:tabular-nums;font-size:14.5px;color:var(--muted);flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px 22px;display:flex;flex-direction:column;gap:10px}
.prow{display:flex;gap:10px;align-items:flex-start}
.prompt{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.2;flex:1;min-width:0;overflow-wrap:anywhere}
.prompt.big{font-size:56px;font-weight:800}
.sub{color:var(--muted);font-size:15.5px}
.blank{display:inline-block;min-width:2.6em;height:.9em;border-bottom:3px solid var(--blue);margin:0 .12em;vertical-align:-.05em}
.spk{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.spk svg{width:20px;height:20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;font-size:17.5px;line-height:1.3}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--pen);background:var(--pen-soft);color:var(--pen);text-decoration:line-through}
.opt:disabled{cursor:default}
.typed{display:flex;flex-direction:column;gap:10px}
.typed input{width:100%;box-sizing:border-box;font:inherit;font-size:23px;font-weight:600;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.typed input:focus{border-color:var(--blue);outline:none}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:40px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:19px;font-weight:600}
.check{width:100%;border:0;border-radius:13px;padding:14px;background:var(--blue);color:var(--on-blue);font-weight:700;font-size:18px}
.fb{display:flex;flex-direction:column;gap:8px;border-radius:16px;padding:14px 16px;border:1.5px solid var(--line);background:var(--card)}
.fb.r{border-color:var(--ok)} .fb.w,.fb.a{border-color:var(--pen)}
.mark{font-family:var(--f-hand);font-weight:700;font-size:32px;line-height:1}
.fb.r .mark{color:var(--ok)} .fb.w .mark,.fb.a .mark{color:var(--pen)}
.ansline{display:flex;gap:10px;align-items:center}
.ansline p{flex:1;min-width:0;font-size:19px;font-weight:700}
/* modes: colour of the label, the top of the question card and the answer box */
.app[data-mode="betek"]{--mc:#4F5D75;--ms:#E8ECF2}.app[data-mode="vert"]{--mc:#2F5596;--ms:#E1E7F0}.app[data-mode="lidw"]{--mc:#0E7C86;--ms:#DCF1F2}
.app[data-mode="meerv"]{--mc:#6D3FC0;--ms:#EEE7FB}.app[data-mode="adj"]{--mc:#A35A06;--ms:#FBEEDC}.app[data-mode="erzin"]{--mc:#3B7A12;--ms:#E6F2DA}
.app[data-mode="regels"]{--mc:#A4401F;--ms:#F6E3DA}.app[data-mode="examen"]{--mc:#8A5A10;--ms:#F6EBD3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .app[data-mode]{--ms:color-mix(in srgb,var(--mc) 22%,var(--card))}
 :root:not([data-theme="light"]) .app[data-mode="betek"]{--mc:#A9B6CC}:root:not([data-theme="light"]) .app[data-mode="vert"]{--mc:#A9C0E8}:root:not([data-theme="light"]) .app[data-mode="lidw"]{--mc:#4FC7CF}
 :root:not([data-theme="light"]) .app[data-mode="meerv"]{--mc:#B79BFF}:root:not([data-theme="light"]) .app[data-mode="adj"]{--mc:#F0A85A}:root:not([data-theme="light"]) .app[data-mode="erzin"]{--mc:#9BD36A}
 :root:not([data-theme="light"]) .app[data-mode="regels"]{--mc:#F08A64}:root:not([data-theme="light"]) .app[data-mode="examen"]{--mc:#E3B45A}}
:root[data-theme="dark"] .app[data-mode]{--ms:color-mix(in srgb,var(--mc) 22%,var(--card))}
:root[data-theme="dark"] .app[data-mode="betek"]{--mc:#A9B6CC}:root[data-theme="dark"] .app[data-mode="vert"]{--mc:#A9C0E8}:root[data-theme="dark"] .app[data-mode="lidw"]{--mc:#4FC7CF}
:root[data-theme="dark"] .app[data-mode="meerv"]{--mc:#B79BFF}:root[data-theme="dark"] .app[data-mode="adj"]{--mc:#F0A85A}:root[data-theme="dark"] .app[data-mode="erzin"]{--mc:#9BD36A}
:root[data-theme="dark"] .app[data-mode="regels"]{--mc:#F08A64}:root[data-theme="dark"] .app[data-mode="examen"]{--mc:#E3B45A}
.app[data-mode] .qtop+.card{border-top:4px solid var(--mc)}
.app[data-mode] .typed input,.app[data-mode] .typed textarea{border-color:color-mix(in srgb,var(--mc) 55%,var(--line))}.app[data-mode] .typed input:focus,.app[data-mode] .typed textarea:focus{border-color:var(--mc)}
.app[data-mode] .card .blank{border-bottom-color:var(--mc)}
.lab{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mc,var(--blue));background:var(--ms,var(--blue-soft));border-radius:99px;padding:4px 10px 4px 8px}
.mode svg{width:16px;height:16px;flex:none}
.mdet{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mx{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--paper);border-radius:99px;padding:3px 9px}
.lab .mdet+.mx,.lab .mode+.mx{margin-left:auto}.mx.r{color:var(--pen);background:var(--pen-soft)}
.plate{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;background:var(--ms,var(--blue-soft));border-radius:12px;padding:10px 14px}
.plate b{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--mc,var(--blue));line-height:1.05}
.plate>span{font-size:15.5px}.plate em{font-style:normal;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mc,var(--blue))}
/* the result sheet after an answer: slides up over the bottom of the screen */
.fb.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:560px;margin:0 auto;box-sizing:border-box;border:0;border-top:1px solid var(--line);border-radius:24px 24px 0 0;
 box-shadow:0 -10px 30px rgba(10,16,28,.16);padding:8px max(18px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));gap:12px;max-height:calc(100dvh - 96px);overflow-y:auto;overscroll-behavior:contain;animation:sheetup .22s ease-out}
@keyframes sheetup{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.fb.sheet{animation:none}}
.fb.sheet .grip{align-self:center;width:44px;height:5px;border-radius:3px;background:var(--line);flex:none}
.fb.sheet .mark{font-size:30px}
.fb.sheet .ansline p{font-size:20px;line-height:1.35}
.fb.sheet .next{width:100%}
.ansline ins{color:var(--ok);background:var(--ok-soft);text-decoration:none;border-bottom:2px solid var(--ok);border-radius:3px;padding:0 1px}
.yb{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.yb.side{grid-template-columns:repeat(2,minmax(0,1fr))}
.yb .box{background:var(--paper);border-radius:12px;padding:9px 12px 10px;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.4;min-width:0}
.yb .box small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.yb .box p{margin:0}.yb .said,.yb .want{font-size:16.5px}.yb .said b{color:var(--pen)}.yb .want{color:var(--ok)}.yb .same{color:var(--ok);font-weight:600}
.yb .box{gap:10px}.yb .yr{display:flex;flex-direction:column;gap:2px}.yb .yr+.yr{border-top:1px solid var(--line);padding-top:9px}.yb .yr small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px;margin-top:-4px}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;border-radius:10px;padding:6px 2px;font-size:13.5px;font-weight:600;color:var(--muted)}
.act svg{width:22px;height:22px;color:var(--blue)}.act:hover{background:var(--blue-soft)}
.fbpad{flex:none}
.ser{white-space:nowrap}
.rv-body .fb.sheet{position:static;max-height:none;box-shadow:none;border:1px solid var(--line);border-radius:16px;animation:none}.rv-body .fbpad,.rv-body .grip,.rv-body .acts{display:none}
.note{color:var(--muted);font-size:15px}
.next{width:100%;border:0;border-radius:13px;padding:14px;background:var(--ink);color:var(--paper);font-weight:700;font-size:18px}

/* results */
.score{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:26px;color:var(--muted)}
.miss{display:flex;flex-direction:column;gap:8px}
.miss li{list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.miss ul{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.miss .q{color:var(--muted);font-size:14.5px}
.miss .a{font-weight:700}
.row{display:flex;flex-direction:column;gap:10px}

/* sheet */
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
details[open]{padding-bottom:14px}
summary{font-family:var(--f-display);font-weight:600;font-size:19px;padding:12px 0;cursor:pointer}
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1.5px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.say{color:var(--blue);cursor:pointer}
td.say:active{opacity:.6}
.tip{font-size:15px;color:var(--muted);margin-top:10px}
.tip b{color:var(--ink)}

/* learning path + ladder */
.stage{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stage-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stage-h p{font-weight:700;font-size:17.5px;min-width:0}
.stage-h span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;flex:none}
.path{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.path i{display:block;height:9px;border-radius:5px;background:var(--blue-soft);overflow:hidden}
.path i b{display:block;height:100%;background:var(--blue)}
.path i.cur{outline:2px solid var(--blue);outline-offset:1px}
.ladder{display:flex;flex-wrap:wrap;gap:6px;font-size:13.5px;color:var(--muted)}
.ladder span{border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.next.alt{background:var(--pen-soft);color:var(--pen)}
.hint{font-family:var(--f-hand);font-size:24px;color:var(--blue);line-height:1.1}
.intro .meaning{color:var(--muted);font-size:16px}
.intro .prompt b,.fill{color:var(--blue)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--blue-soft);color:var(--blue);margin-left:6px;vertical-align:2px}
.ov{align-self:flex-start}

.plan{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.plan p{font-size:15.5px;color:var(--muted)} .plan b{color:var(--ink)}
.seg{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.seg span{font-size:14px;color:var(--muted);margin-right:4px}
.seg button{min-width:46px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}

.gw{border-bottom:1.5px dotted currentColor;cursor:pointer;border-radius:3px;-webkit-tap-highlight-color:transparent}
.gw.on{background:var(--blue-soft)}
#tip{position:fixed;z-index:30;display:flex;flex-direction:column;gap:3px;max-width:min(300px,calc(100vw - 32px));background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:14.5px;font-weight:600;line-height:1.3;padding:7px 11px;border-radius:9px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.2)}

.pill{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.behind{background:var(--pen-soft);color:var(--pen)}
.meter.tm{height:10px;margin-top:0;border-radius:5px}
.today .tline{font-size:15.5px;font-variant-numeric:tabular-nums}

#tip b{font-size:15.5px}
#tip .tf{font-weight:600;opacity:.8;font-size:13.5px}
#tip .ty{font-weight:400;opacity:.92;font-size:13.5px}

.btab td{font-size:16.5px}
.btab .end{color:var(--blue)}
.sayrow{cursor:pointer}.sayrow:active td{background:var(--blue-soft)}
.fam{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.fam p:empty{display:none}
.ttab td{vertical-align:middle;padding:6px 6px}

,"ch":5,"nl":"tegen","en":"against","pos":"prep"},{"id":"h5-voor","ch":5,"nl":"voor","en":"in front of","pos":"prep"},{"id":"h5-lenen","ch":5,"nl":"lenen","en":"to borrow","pos":"verb"},{"id":"h5-uitlenen","ch":5,"nl":"uitlenen","en":"to lend","pos":"verb","sep":"leen … uit"},{"id":"h5-weggeven","ch":5,"nl":"weggeven","en":"to give away","pos":"verb","sep":"geef … weg"},{"id":"h5-hoog","ch":5,"nl":"hoog","en":"high, tall","pos":"adj","cat":"size"},{"id":"h5-laag","ch":5,"nl":"laag","en":"low","pos":"adj","cat":"size"},{"id":"h5-dik","ch":5,"nl":"dik","en":"thick","pos":"adj","cat":"size"},{"id":"h5-vuil","ch":5,"nl":"vuil","en":"dirty","pos":"adj"},{"id":"h5-kapot","ch":5,"nl":"kapot","en":"broken","pos":"adj"},{"id":"h5-gescheurd","ch":5,"nl":"gescheurd","en":"torn","pos":"adj"},{"id":"h5-favoriet","ch":5,"nl":"favoriet","en":"favourite","pos":"adj"}]}],"rules":{"rules":[{"id":"adj-e","ch":1,"t":"Adjectief + e","en":"adjective endings","x":"Before a de-word or a plural: + e (de rode jas, rode jassen). Before a het-word: + e after het, dit, dat, mijn, zijn, haar …, but no -e after een, geen or nothing (het grote huis · een groot huis). After the noun (is / zijn): never -e (de jas is rood). Adjectives ending in -en or -e, and plastic and effen, never take -e (een houten tafel, een oranje jas).","ex":["een groen hemd","het groene hemd","groene hemden","de jas is rood","een houten tafel"]},{"id":"de-het","ch":1,"t":"de of het?","en":"de-words and het-words","x":"Learn every noun with its article. The plural always takes de (het hemd → de hemden). Words ending in -je are het-words (het nachtkastje). After een the article disappears, so the adjective shows it: een groot huis (het), een grote tafel (de).","ex":["het hemd · de hemden","het nachtkastje","de jas · de jassen"]},{"id":"dragen","ch":1,"t":"Iemand beschrijven","en":"describing a person","x":"Use draagt (wears), heeft (has) and is: Ze draagt een rode jas. Hij heeft een bril. Haar sjaal is geel. Ze draagt een jurk met korte mouwen: after met the adjective takes -e before a plural or a de-word.","ex":["Ze draagt een lange jurk.","Hij heeft een zwarte hoed.","Zijn schoenen zijn bruin."]},{"id":"presens","ch":1,"t":"Presens","en":"present tense","x":"ik + stem (draag), jij / u / hij / zij + stem + t (draagt), wij / jullie / zij + infinitive (dragen). Jij after the verb loses the t: Draag jij …? A stem already ending in t gets no extra t (zit, moet). zijn: ik ben, jij bent, hij is, wij zijn · hebben: ik heb, jij hebt, hij heeft, wij hebben.","ex":["ik draag","jij draagt · draag jij?","hij heeft","wij zitten"]},{"id":"verb-2","ch":1,"t":"Werkwoord op plaats 2","en":"verb in second place","x":"In a normal sentence the verb is always the 2nd part. When the sentence starts with something else than the subject (Over de jurk, In de klas, Ook), the subject comes after the verb.","ex":["Ze draagt een jas.","Over de jurk draagt ze een jas.","In de klas moet je stil zijn."]},{"id":"er","ch":5,"t":"Er staat / ligt / hangt","en":"er as temporary subject","x":"Er + verb + what + where: Er staat een tafel in de kamer. staan = upright (a table, a cupboard, a lamp), liggen = flat (a rug, a cushion), hangen = on a wall or from the ceiling (a painting, curtains, a ceiling lamp), zitten = people and animals. One thing: staat, ligt, hangt. Two or more: staan, liggen, hangen.","ex":["Er staat een grote kast tegen de muur.","Er liggen drie kussens in de zetel.","Er hangt een schilderij boven de zetel."]},{"id":"er-presens","ch":5,"t":"staan · liggen · hangen","en":"present tense of the position verbs","x":"ik sta, jij staat, hij staat, wij staan · ik lig, jij ligt, hij ligt, wij liggen · ik hang, jij hangt, hij hangt, wij hangen · ik zit, jij zit, hij zit, wij zitten.","ex":["ik sta · wij staan","ik lig · wij liggen","ik hang · wij hangen"]},{"id":"prep","ch":5,"t":"Voorzetsels","en":"prepositions of place","x":"in, op, onder, naast, voor, achter, tussen, boven, tegen, aan + de / het + noun: tegen de muur, onder de tafel, boven de zetel, aan de muur, tussen de zetel en de kast.","ex":["onder de salontafel","boven de zetel","voor het raam","tussen het bed en de kast"]},{"id":"modal","ch":3,"t":"moeten · mogen · kunnen · willen","en":"modal verbs + infinitive","x":"moeten = obligation (verplicht), mogen = permission (toegelaten), niet mogen = prohibition (verboden), kunnen = ability, willen = wish. The modal is the verb in 2nd place, the infinitive goes to the end: Je moet je gsm uitzetten.","ex":["Je moet op tijd komen.","Je mag een vraag stellen.","Je mag hier niet roken."]},{"id":"modal-forms","ch":3,"t":"moeten · mogen (presens)","en":"forms of moeten and mogen","x":"ik moet, jij moet, hij moet, wij moeten · ik mag, jij mag, hij mag, wij mogen · ik kan, jij kan (kunt), hij kan, wij kunnen · ik wil, jij wil (wilt), hij wil, wij willen.","ex":["je moet","je mag","wij mogen"]},{"id":"geen-niet","ch":3,"t":"geen of niet?","en":"geen or niet","x":"geen replaces een, or stands before a noun without de / het: Je mag geen koffie drinken (not: niet koffie). niet goes with the verb: before the infinitive, or after a noun with de / het: Je mag niet praten. Je mag de eendjes niet voederen.","ex":["Je mag geen koffie drinken.","Je mag niet praten.","Je mag de eendjes niet voederen."]},{"id":"sep","ch":3,"t":"Scheidbare werkwoorden","en":"separable verbs","x":"In the present the prefix goes to the end: Ik gooi het afval weg (weggooien). After a modal the verb stays together at the end: Je moet het afval weggooien.","ex":["Ik zet de vuilniszak buiten.","Je moet de vuilniszak buitenzetten.","Hoe ziet het appartement eruit?"]},{"id":"conj","ch":4,"t":"en · maar · want · omdat","en":"joining sentences","x":"en, maar, want + normal word order (subject + verb): Het appartement is mooi, maar het is duur. omdat sends the verb to the end: Ik huur het appartement, omdat het dicht bij mijn werk is.","ex":["Het is ruim, maar het is duur.","Ik verhuis, want mijn appartement is te klein.","Ik verhuis, omdat mijn appartement te klein is."]},{"id":"comp","ch":4,"t":"Vergelijken","en":"comparing","x":"adjective + er + dan: groter dan, duurder dan (r → rder), verder. Irregular: veel → meer, goed → beter, graag → liever, weinig → minder.","ex":["Het huis is groter dan het appartement.","Gent is duurder dan Deinze.","Ik woon liever in een rustige buurt."]},{"id":"spelling","ch":1,"t":"Spelling: lange en korte klanken","en":"spelling rules","x":"A long vowel at the end of a syllable is written once: groot → grote, rood → rode, laars → laarzen, eten (not eeten). A short vowel keeps its sound by doubling the consonant: wit → witte, rok → rokken, pet → petten. Between vowels f becomes v and s becomes z: lief → lieve, grijs → grijze.","ex":["groot → grote","wit → witte","lief → lieve","grijs → grijze"]}],"lexicon":{"note":"Words the checker knows but that are not study terms (they appear in pictures, model texts and rules).","nouns":[{"nl":"het midden","en":"middle"},{"nl":"de tas","en":"bag","pl":"tassen"},{"nl":"de handtas","en":"handbag","pl":"handtassen"},{"nl":"de bril","en":"glasses","pl":"brillen"},{"nl":"de kous","en":"sock","pl":"kousen"},{"nl":"de ketting","en":"necklace","pl":"kettingen"},{"nl":"het horloge","en":"watch","pl":"horloges"},{"nl":"de persoon","en":"person","pl":"personen"},{"nl":"de man","en":"man","pl":"mannen"},{"nl":"de vrouw","en":"woman","pl":"vrouwen"},{"nl":"het kind","en":"child","pl":"kinderen"},{"nl":"de jongen","en":"boy","pl":"jongens"},{"nl":"het meisje","en":"girl","pl":"meisjes"},{"nl":"de klas","en":"class","pl":"klassen"},{"nl":"de smartphone","en":"smartphone","pl":"smartphones"},{"nl":"de gsm","en":"mobile phone","pl":"gsm's"},{"nl":"de vraag","en":"question","pl":"vragen"},{"nl":"het examen","en":"exam","pl":"examens"},{"nl":"de les","en":"lesson","pl":"lessen"},{"nl":"de koffie","en":"coffee"},{"nl":"de thee","en":"tea"},{"nl":"het water","en":"water"},{"nl":"het eten","en":"food"},{"nl":"de kauwgom","en":"chewin "en":"soft"},{"nl":"dun","en":"thin"},{"nl":"hard","en":"hard"},{"nl":"zwaar","en":"heavy"},{"nl":"elegant","en":"elegant"},{"nl":"sportief","en":"sporty"},{"nl":"zilveren","en":"silver","cat":"material","noE":true},{"nl":"gouden","en":"golden","cat":"material","noE":true},{"nl":"wollen","en":"woollen","cat":"material","noE":true},{"nl":"katoenen","en":"cotton","cat":"material","noE":true},{"nl":"gestippeld","en":"dotted","cat":"pattern"},{"nl":"lederen","en":"leather","cat":"material","noE":true},{"nl":"staand","en":"standing","eForm":"staande"},{"nl":"goed","en":"good"},{"nl":"graag","en":"gladly (liever = rather)"},{"nl":"ver","en":"far"}],"words":"de het een er en maar want omdat of dat als dan ook niet geen wel hier daar heel erg zeer te nog al nu altijd nooit soms vandaag morgen eerst samen luid stil binnen buiten thuis mee in op aan achter bij van uit naar over tijdens door om tot zonder met voor onder naast boven tegen tussen ik jij je hij zij ze het we wij jullie u hun haar zijn mijn jouw uw ons onze die deze dit wat wie waar hoe welk welke waarom zo'n elk elke alle veel weinig meer minder beter liever groter duurder verder persoon twee drie vier vijf zes zeven acht negen tien elf twaalf twintig honderd eerste tweede derde laatste één ja nee dag goed graag echt zelf iets niets alles iemand niemand sommige andere ander m² euro per maand jaar week uur minuten"}},"exam":{"title":"Schriftelijk examen 1.2","date":"2026-10-29","scope":[1,3,4,5],"noPerfectum":true,"note":"studeer boek schriftelijk deel 1-3-4-5, geen perfectum","product":"evaluatie schriftelijk PRODUCT 1: SD1, SD3, SD4, SD5","drills":[{"id":"sd1","code":"SD1","nl":"Beschrijf persoon 1 en persoon 2","en":"Describe person 1 and person 2","min":4,"people":2,"task":"Write at least 4 sentences about each person: what they wear, colours, patterns, long or short."},{"id":"sd5","code":"SD5","nl":"Beschrijf de kamer","en":"Describe the room","exact":6,"task":"Write exactly 6 sentences. Use Er staat / staan, /* an e-mail: the greeting (Beste … / Dag …) and the closing (Met vriendelijke groeten, name) are not sentences */

function checkForm(g,want,also){const G=norm(g),acc=[want,...(also||[])].map(norm);if(acc.includes(G))return{res:'right'};

function pile(id){const t=S[id];if(!t)return 'new';if(t.lr)return t.lr==='r'?'rev':'fix';if(t.cr)return 'rev';return t.w>0&&t.b<2?'fix':t.b>=2?'rev':'fix'}

function newBudget(P){const M=mix(),acc=S._acc;let n=M.n,why=null;
 if(acc&&acc.n>=8&&acc.ok/acc.n<0.5){n=Math.floor(M.n/2);why=`last round ${acc.ok}/${acc.n} right`}
 if(acc&&acc.n>=8&&acc.ok/acc.n<0.3)n=Math.min(n,2);
 if(P.fix.length>3*Math.max(M.m,4)){n=Math.min(n,Math.floor(M.n/2));why=why||`${P.fix.length} terms waiting to be fixed`}

function pickNew(unseen,budget){const fresh=[],taken=new Set();let used=0,groups=0;const maxG=budget>=12?2:1;

  if(it.group){if(groups>=maxG)continue;const mem=unseen.filter(x=>x.group===it.group),cost=GROUP_COST(mem.length);
   if(used+cost>budget&&used>0)continue;mem.forEach(x=>{taken.add(x);fresh.push(x)});used+=cost;groups++}

 if(Date.now()-(o.at||0)>3*864e5)return null;return o}catch(e){return null}}

function resumeSess(){const o=savedSess();if(!o)return false;const byId=id=>ITEMS.find(x=>x.id===id);
 const queue=o.queue.map(e=>({...e,it:byId(e.id)})).filter(e=>e.it);
 const log=o.log.map(l=>{const it=byId(l.id);return it?{...l,it,q:it.make('write')}:null}).filter(Boolean);
 let i=Math.min(o.i,queue.length);if(o.answeredAt===o.i)i++;if(i>=queue.length){clearSess();return false}

const MARKS={hint:['Goed, met een tip.'],right:['Goed zo!','Super!','Proficiat!','Amai, goed!','Perfect!'],accent:['Bijna! Let op de schrijfwijze.'],wrong:['Oei…','Nog niet.','Helaas…']};
function finish(res,given,msg,quick,r){r=r||{};
 const cur=sess.queue[sess.i],q=cur.q,id=cur.it.id;

 else if(res!=='right'&&sess.nut&&(cur.tries||1)<3){sess.put({it:cur.it,st:'write',retry:true,tries:(cur.tries||1)+1,slot:cur.slot},3);requeued=true}
 else if(res!=='right'&&!cur.retry&&!sess.nut&&!cur.practice){sess.queue.push({it:cur.it,st:'write',retry:true,slot:cur.slot});requeued=true}
 sess.answeredAt=sess.i;saveSess();
 if(quick)return next();
 const shown=q.answer;
 let tgt=q.kind==='type'&&q.accept?q.accept[0]:q.answer;
 const pe=app.querySelector('.card .prompt');
 if(pe&&String(q.prompt).includes('___'))pe.outerHTML=promptHTML(q,q.answer,1);

 /* the result sheet: the correct answer (what you missed in green), what you actually said, why, then Volgende */

  hide:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><path d="M4 4l16 16"/></svg>'};
 const acts=[];
 if(res!=='right'&&res!=='hint'&&tgt)acts.push(`<button class="act" id="drill">${IC.pen}${L('Schrijf 3×','write it 3 times')}</button>`);
 if(res==='wrong'&&q.kind==='type'&&counts)acts.push(`<button class="act ov" id="ov">${IC.ok}${L('Was ook juist','my answer was correct too')}</button>`);
 if(res==='right'&&counts&&!sess.test)acts.push(`<button class="act ov" id="easy">${IC.later}${L('Te makkelijk','too easy · later','','Pushes this term further back.')}</button>`);
 if(!(sess.test||cur.practice))acts.push(`<button class="act ov hidebtn" id="hideit">${IC.hide}${L('Verberg','hide this term')}</button>`);
 const notes=[msg||'',
  q.note&&(res!=='right'||q.kind==='mc')&&!(msg||'').replace(/<[^>]*>/g,'').includes(q.note)?esc(q.note):'',

 $('#nx').onclick=next;const hb2=$('#hideit');if(hb2)hb2.onclick=()=>hideAndSkip(id);

/* what an option means (shown after answering a multiple-choice question) */
let MEANS=null;
function meanTable(){if(MEANS)return MEANS;const m=new Map(),put=(k,v)=>{if(k&&v&&!m.has(k))m.set(k,v)};
 WL.forEach(w=>{put(w.nl,w.en);put(w.en,'= '+w.nl);if(w.pos==='noun')put(`${w.art==='de'?'het':'de'} ${w.word}`,`✗ ${w.word} is a ${AN(w.art)}: ${w.nl}`)});
 Object.values(ERW).forEach(v=>{});return MEANS=m}
function meaningOf(opt,q){if(q.mean&&q.mean[opt])return q.mean[opt];const t=meanTable().get(opt);if(t)return t;const g=glossWord(opt);return g?g.filter(Boolean).join(' · '):null}
/* a wrong answer that is another word of the course: name it */
let ANS=null;
function answerIndex(){if(ANS)return ANS;ANS=new Map();WL.forEach(w=>{ANS.set(strip(norm(w.nl)),{text:w.nl,mean:w.en,id:w.id});if(w.pl)ANS.set(strip(norm('de '+w.pl)),{text:'de '+w.pl,mean:'plural of '+w.nl,id:w.id})});return ANS}
function confusedWith(given,q){const g=strip(norm(given));if(!g)return null;const own=new Set([...(q.accept||[]),q.answer].filter(Boolean).map(a=>strip(norm(a))));
 const hit=answerIndex().get(g);if(!hit||own.has(strip(norm(hit.text))))return null;return hit}

/* ======================================================================
   Exam drills (SD1, SD3, SD4, SD5): a picture made from content/exam.json, free text, the checker's report
   and model answers. A picture is drawn from a number (seed), so it comes back the same after a reload.
   ====================================================================== */
const shuffleR=(R,a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const HEX=c=>EXAM.colours[c]||c||'#999';
const lum=h=>{const n=parseInt(String(h).slice(1),16);if(isNaN(n))return 1;return(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255};
const contrast=h=>lum(h)>.62?'#2B2F38':'#FFFFFF';
let PID=0;
/* a fill: colour, or colour with a pattern (gestreept, geruit, gebloemd, met bolletjes) */
function fillDef(colour,pattern,defs){const c=HEX(colour);if(!pattern||pattern==='effen')return c;const id='pt'+(++PID),k=contrast(c);
 const P={gestreept:`<rect width="10" height="10" fill="${c}"/><rect width="10" height="4" fill="${k}" opacity=".85"/>`,
  geruit:`<rect width="10" height="10" fill="${c}"/><rect width="5" height="10" fill="${k}" opacity=".35"/><rect width="10" height="5" fill="${k}" opacity=".35"/>`,
  gebloemd:`<rect width="12" height="12" fill="${c}"/><circle cx="6" cy="6" r="2.6" fill="${k}"/><circle cx="6" cy="2.8" r="1.6" fill="${k}" opacity=".8"/><circle cx="6" cy="9.2" r="1.6" fill="${k}" opacity=".8"/><circle cx="2.8" cy="6" r="1.6" fill="${k}" opacity=".8"/><circle cx="9.2" cy="6" r="1.6" fill="${k}" opacity=".8"/>`,
  'met bolletjes':`<rect width="10" height="10" fill="${c}"/><circle cx="5" cy="5" r="2.2" fill="${k}"/>`}[pattern];
 const s=pattern==='gebloemd'?12:10;defs.push(`<pattern id="${id}" width="${s}" height="${s}" patternUnits="userSpaceOnUse">${P}</pattern>`);return `url(#${id})`}

/* ---------- SD1: a person ---------- */
function makePerson(R,n){const P=EXAM.people,who=pickR(R,P.who),f=who.f,ok=x=>!x.only||(x.only==='f')===f;
 const cols=Object.keys(EXAM.colours),col=(not)=>{let c;do{c=pickR(R,cols)}while(not&&not.includes(c));return c};
 const pat=()=>R()<.6?'effen':pickR(R,['gestreept','geruit','gebloemd','met bolletjes']);
 const items=[];let top=null;
 if(f&&R()<P.dress.p){top={...P.dress,slot:'dress',colour:col(),pattern:pat(),len:pickR(R,P.dress.len),sleeves:pickR(R,P.dress.sleeves)};items.push(top)}
 else if(!f&&R()<P.suit.p){top={noun:'het hemd',draw:'shirt',slot:'top',colour:pickR(R,['wit','lichtblauw']),pattern:'effen',sleeves:'lang'};items.push(top);items.push({...P.suit,slot:'suit',colour:pickR(R,P.suit.colours),pattern:'effen'})}

 else{const extra=id==='sd5'?{universe:universe('sd5'),scene:sc.objs.map(o=>({nl:o.count>1&&o.noun.pl?`de ${o.noun.pl}`:`${o.noun.art} ${o.noun.word}`,lw:[...o.item.nouns.map(n=>(nounNL(n)||{}).lw),lo(o.noun.pl||'')].filter(Boolean)}))}:{};res.push({label:'',r:checkText(texts[0],{...spec,...extra}),model:id==='sd5'?roomModel(sc):id==='sd3'?sc.rules.map(r=>r.nl).join(' '):null})}

 $('#exres').innerHTML=`<div class="sum ${all?'ok':'bad'}"><p class="mark">${all?pick(['Proficiat!','Amai, perfect!','Super!']):nIss<=2?'Bijna!':'Nog wat werk'}</p>

<script>
/* ---------- sync between devices through a private GitHub gist (its own gist: nederlands-test-1.2 progress) ---------- */
(function(){
 const TK='nl-gh-token',GI='nl-gh-gist',DESC='nederlands-test-1.2 progress',FILE='nederlands-progress.json',API='https://api.github.com';
 const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},set=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
 let state={msg:'',busy:false,last:null},timer=null,form=false,showTok=false;
 const hdr=()=>({'Authorization':'Bearer '+get(TK),'Accept':'application/vnd.github+json','Content-Type':'application/json'});
 async function gh(path,opt){const r=await fetch(API+path,{...opt,headers:hdr()});if(!r.ok){const e=new Error(r.status===401?'The token was not accepted. Create a new one and paste it again.':r.status===403||r.status===404?'The token has no access to gists. Make sure the “gist” box is ticked.':'GitHub answered '+r.status+'.');e.status=r.status;throw e}return r.json()}
 async function findGist(){let id=get(GI);if(id)return id;
  const list=await gh('/gists?per_page=100');const g=list.find(x=>x.description===DESC);
  if(g){set(GI,g.id);return g.id}
  const c=await gh('/gists',{method:'POST',body:JSON.stringify({description:DESC,public:false,files:{[FILE]:{content:JSON.stringify(S)}}})});set(GI,c.id);return c.id}
 async function syncNow(){if(!get(TK)||state.busy)return;state.busy=true;state.msg='Syncing…';draw();
  try{const id=await findGist();let g;try{g=await gh('/gists/'+id)}catch(e){if(e.status===404){set(GI,null);state.busy=false;return syncNow()}throw e}
   const f=g.files&&g.files[FILE];let remote={};
   if(f){let txt=f.content;if(f.truncated){txt=await (await fetch(f.raw_url)).text()}try{remote=JSON.parse(txt)||{}}catch(e){remote={}}}
   const merged=mergeS(S,remote);
   /* always take in the other device's progress (the more-practised copy of each term wins, so a running round is safe) */
   {const before=JSON.stringify(S);S=merged;saveLocal();if(JSON.stringify(S)!==before&&!sess&&view==='home')home()}
   if(JSON.stringify(merged)!==JSON.stringify(remote))await gh('/gists/'+id,{method:'PATCH',body:JSON.stringify({files:{[FILE]:{content:JSON.stringify(merged)}}})});
   state.last=new Date();state.msg=''}
  catch(e){state.msg=e.message||'Could not reach GitHub. Progress is safe on this device and syncs next time.'}
  state.busy=false;draw()}
 window.onProgressSaved=()=>{if(!get(TK))return;clearTimeout(timer);timer=setTimeout(syncNow,4000)};
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
 function draw(){const el=document.getElementById('sync');if(!el)return;const on=!!get(TK);
  if(form){el.innerHTML=`<span class="sy-box"><b>Sync between devices</b>
   <span>1. On GitHub, <a href="https://github.com/settings/tokens/new?scopes=gist,public_repo&description=Nederlands%20sync" target="_blank" rel="noopener">create a token</a> with the “gist” box ticked (and “public_repo”, so feedback can be sent), then tap Generate token and copy it. The token you use for the Polish app works too.</span>
   <span>2. Paste it here (it replaces any token saved before). Use the same token on your other device.</span>
   <input id="sy-in" type="password" autocomplete="off" placeholder="ghp_…" aria-label="GitHub token">
   <span class="sy-row"><button class="ghost" id="sy-save">Save and sync</button><button class="ghost" id="sy-x">Cancel</button></span></span>`;
   document.getElementById('sy-save').onclick=()=>{const v=document.getElementById('sy-in').value.trim();if(!v)return;set(TK,v);set(GI,null);form=false;syncNow()};
   document.getElementById('sy-x').onclick=()=>{form=false;draw()};return}
  const t=state.last?state.last.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):null;
  el.innerHTML=on?`${state.msg&&state.msg!=='Syncing…'?L('Probleem met synchroniseren','sync problem')+': '+esc(state.msg):state.msg==='Syncing…'?L('Bezig met synchroniseren…','syncing…'):L('Gesynchroniseerd','synced between your devices')+(t?' · '+L('laatst','last')+' '+t:'')}<br><button class="sy-link" id="sy-now">${L('Nu synchroniseren','sync now')}</button> · <button class="sy-link" id="sy-tok">${L('Toon token','show token for another device')}</button> · <button class="sy-link" id="sy-chg">${L('Ander token','change token')}</button> · <button class="sy-link" id="sy-off">${L('Uitzetten','turn off','separable: ik zet … uit')}</button>
   ${showTok?`<span class="sy-box"><b>Your sync token</b><span>Paste it on your other device under “Sync between devices”. Keep it private: it gives access to your gists.</span><input id="sy-tokv" type="text" readonly value="${esc(get(TK))}"><span class="sy-row"><button class="ghost" id="sy-copy">Copy</button><button class="ghost" id="sy-hide">Hide</button></span></span>`:''}`
   :`${L('Je vooruitgang staat alleen op dit toestel.','progress is saved on this device only','het toestel = the device (Flemish)')} <button class="sy-link" id="sy-on">${L('Synchroniseren instellen','set up sync')}</button>`;
  const b1=document.getElementById('sy-on');if(b1)b1.onclick=()=>{form=true;draw()};
  const b2=document.getElementById('sy-now');if(b2)b2.onclick=syncNow;
  const bt=document.getElementById('sy-tok');if(bt)bt.onclick=()=>{showTok=true;draw()};
  const bh=document.getElementById('sy-hide');if(bh)bh.onclick=()=>{showTok=false;draw()};
  const bc=document.getElementById('sy-copy');if(bc)bc.onclick=()=>{const v=document.getElementById('sy-tokv');navigator.clipboard&&navigator.clipboard.writeText(v.value).then(()=>{bc.textContent='Copied'},()=>{v.select()})||v.select()};
  const bg=document.getElementById('sy-chg');if(bg)bg.onclick=()=>{form=true;draw()};
  const b3=document.getElementById('sy-off');if(b3)b3.onclick=()=>{set(TK,null);set(GI,null);state.last=null;state.msg='';draw()}}
 /* also sync each time the home screen is shown (at most every 20 s) */
 let lastHomeSync=0;const _home=window.home;window.home=function(){const r=_home.apply(this,arguments);
  if(!get(TK)){const a=document.getElementById('app');if(a&&!document.getElementById('sy-top')){const bd=a.querySelector('.band'),h='<button class="sybar" id="sy-top">'+ICON.nosync.replace('<svg','<svg class="sbi"')+L('Niet gesynchroniseerd · instellen','this device is not synced · set up sync')+'</button>';bd?bd.insertAdjacentHTML('afterend',h):a.insertAdjacentHTML('afterbegin',h);document.getElementById('sy-top').onclick=()=>{settingsView();form=true;draw();const el=document.getElementById('sync');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}}}if(get(TK)&&Date.now()-lastHomeSync>20000){lastHomeSync=Date.now();setTimeout(syncNow,50)}return r};
 window.updSync=draw;if(!sess&&view==='home')window.home();draw();syncNow();
})();
</script>

 function context(){const c=(typeof sess!=='undefined'&&sess&&sess.queue)?sess.queue[sess.i]:null,ti=document.getElementById('ti');
  return {screen:(sess&&c)?(sess.test?'mock test':sess.nut?'harde noot':'round'):view,round:sess?sess.title:null,item:c?c.it.id:null,prompt:c&&c.q?c.q.prompt:null,answer:c&&c.q?((c.q.accept&&c.q.accept[0])||c.q.mcAnswer||c.q.answer):null,typed:ti&&ti.value?ti.value:null,when:new Date().toISOString(),device:/iPhone|iPad/.test(navigator.userAgent)?'iPhone':/Mac|Windows|Linux/.test(navigator.userAgent)?'computer':'other'}}
 function openSheet(el){el.classList.add('fbsel');const snip=(el.innerText||el.textContent||'').trim().replace(/\s+/g,' ').slice(0,240)||'(element without text)';const ctx=context();
  const sh=document.createElement('div');sh.id='fbsheet';sh.innerHTML=`<div class="fbs"><b>${L('Opmerking','feedback')}</b>
   <p class="fbsnip">${esc(snip)}</p><textarea id="fbtext" rows="4" placeholder="What is wrong, or what would you like? (English is fine)"></textarea>
   <p class="note" id="fbmsg"></p><div class="sy-row"><button class="check" id="fbsend">${L('Verstuur','send')}</button><button class="ghost" id="fbcancel">${L('Annuleer','cancel')}</button></div></div>`;
  document.body.appendChild(sh);const close=()=>{sh.remove();el.classList.remove('fbsel')};
  document.getElementById('fbcancel').onclick=close;document.getElementById('fbtext').focus();
  document.getElementById('fbsend').onclick=async()=>{const txt=document.getElementById('fbtext').value.trim();if(!txt)return;
   const q=getQ();q.push({snip,txt,ctx});setQ(q);const m=await flush();document.getElementById('fbmsg').innerHTML=m;
   if(/^Sent/.test(m))setTimeout(close,900);else{document.getElementById('fbsend').hidden=true;document.getElementById('fbcancel').textContent='OK'}}}
 async function flush(){const q=getQ();if(!q.length)return '';const t=tok();
  if(!t)return 'Saved on this device. It is sent automatically once sync is set up (Instellingen → Synchroniseren).';
  const left=[];let msg='Sent. Thanks!';
  for(const f of q){const body='**Selected:** '+f.snip+'\n\n**Comment:** '+f.txt+'\n\n```json\n'+JSON.stringify(f.ctx,null,1)+'\n```';
   const post=labels=>fetch(API+'/repos/'+REPO+'/issues',{method:'POST',headers:{'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({title:'Feedback: '+f.txt.slice(0,70),body,...(labels?{labels:['feedback']}:{})})});
   try{let r=await post(1);if(r.status===422)r=await post(0);
    if(!r.ok){left.push(f);msg=(r.status===401||r.status===403||r.status===404)?'Saved, not sent yet: your token cannot create issues. On GitHub open <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">Settings → Tokens</a>, open your token, tick <b>public_repo</b> and tap Update token (the token itself stays the same). It is then sent automatically.':'Saved, not sent yet (GitHub answered '+r.status+'). It is retried automatically.'}}
   catch(e){left.push(f);msg='Saved, not sent yet: no connection. It is retried automatically.'}}
  setQ(left);return msg}
 setTimeout(flush,3000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')flush()});
})();
</script>
